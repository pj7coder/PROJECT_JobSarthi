<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Hub - JobSarthi Seeker</title>
  <meta name="description" content="Stay up to date with job applications, mock reviews, and alerts from Sarthi AI.">
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.min.js" integrity="sha384-YCxwI7HW+hlnktW3yOnKN44k9F/E859McBSCz+NoK45Sww88vGY9Kqfdo794td6J" crossorigin="anonymous"></script>
  <script>
    if (localStorage.getItem('seeker_logged_in') !== 'true') {
      window.location.replace('login_signup.html');
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme && savedTheme !== 'dark') {
      document.documentElement.classList.add(savedTheme + '-theme');
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add(savedTheme + '-theme');
      });
    }
  </script>
  <style>
    .notif-container {
      max-width: 800px;
      margin: 30px auto;
    }

    .notif-header-panel {
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .notif-tabs {
      display: flex;
      gap: 16px;
    }

    .notif-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      transition: var(--transition-fast);
    }

    .notif-tab.active {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      box-shadow: inset 0 0 8px rgba(255,255,255,0.05);
    }

    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notif-card {
      padding: 20px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: flex-start;
      position: relative;
      overflow: hidden;
    }

    .notif-card.unread::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent-secondary);
    }

    .notif-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .notif-card.unread .notif-icon {
      border-color: rgba(6, 182, 212, 0.3);
      background: rgba(6, 182, 212, 0.08);
      color: var(--accent-secondary);
    }

    .notif-info h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .notif-info p {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .notif-time {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .notif-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-check {
      cursor: pointer;
      color: var(--text-muted);
      background: none;
      border: none;
      transition: var(--transition-fast);
    }

    .action-check:hover {
      color: var(--accent-secondary);
    }

    /* Unread Card Tint & Hover States */
    .notif-card.unread {
      background: rgba(37, 99, 235, 0.06);
      border-color: rgba(37, 99, 235, 0.2);
    }

    /* Light Theme Compatibility */
    body.light-theme .notif-tab.active {
      background: rgba(0, 0, 0, 0.05);
      color: var(--text-main);
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.02);
    }

    body.light-theme .notif-tab:hover:not(.active) {
      background: rgba(0, 0, 0, 0.02);
      color: var(--text-main);
    }

    body.light-theme .notif-card.unread {
      background: rgba(37, 99, 235, 0.04);
      border-color: rgba(37, 99, 235, 0.15);
    }

    body.light-theme .action-check {
      color: var(--text-muted);
    }

    body.light-theme .action-check:hover {
      color: var(--accent-secondary);
    }
  </style>
</head>
<body>
  <!-- Liquid Glass Backdrop Blobs -->
  <div class="liquid-blob-container">
    <div class="liquid-blob blob-1"></div>
    <div class="liquid-blob blob-2"></div>
    <div class="liquid-blob blob-3"></div>
  </div>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Seeker Header (loaded dynamically via js/header.js) -->
  <div class="header-wrapper"></div>

  <main class="container">
    <div class="notif-container">
      <!-- Title & Clear Controls -->
      <div class="glass-panel notif-header-panel">
        <div>
          <h1 style="font-size: 1.6rem; margin-bottom: 4px;">Notifications Hub</h1>
          <p style="color: var(--text-muted); font-size: 0.85rem;" id="unreadCounter">0 unread notifications</p>
        </div>
        <button class="btn btn-secondary" style="padding: 8px 16px; font-size: 0.85rem;" onclick="clearAllNotifications()">Clear All</button>
      </div>

      <!-- Filters Row -->
      <div class="glass-panel" style="padding: 12px; margin-bottom: 20px; border-radius: var(--radius-md);">
        <div class="notif-tabs">
          <button class="notif-tab active" onclick="switchFilter(this, 'all')">All</button>
          <button class="notif-tab" onclick="switchFilter(this, 'unread')">Unread</button>
          <button class="notif-tab" onclick="switchFilter(this, 'jobs')">Applications</button>
          <button class="notif-tab" onclick="switchFilter(this, 'sarthi')">Sarthi AI Tips</button>
        </div>
      </div>

      <!-- Feed List -->
      <div class="notif-list" id="notifListContainer">
        <!-- Rendered items go here -->
      </div>
    </div>
  </main>

  <script src="../js/header.js"></script>
  <script>
    const API_BASE = window.API_BASE_URL || '';
    let currentFilter = 'all';
    let allNotifs = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('seeker_logged_in') !== 'true') {
        window.location.href = 'login_signup.html'; return;
      }
      loadNotifications();
    });

    async function loadNotifications() {
      const email = localStorage.getItem('seeker_email');
      if (!email) return;
      try {
        const res = await fetch(API_BASE + '/api/notifications?email=' + encodeURIComponent(email) + '&role=seeker');
        if (!res.ok) throw new Error('fetch failed');
        allNotifs = await res.json();
      } catch(e) {
        // fallback: show empty
        allNotifs = [];
      }
      renderNotifications();
    }

    function timeAgo(isoStr) {
      if (!isoStr) return '';
      const diff = Date.now() - new Date(isoStr).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    function switchFilter(btn, filter) {
      document.querySelectorAll('.notif-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = filter;
      renderNotifications();
    }

    function renderNotifications() {
      const container = document.getElementById('notifListContainer');
      container.innerHTML = '';
      const unreadCount = allNotifs.filter(n => !n.read).length;
      document.getElementById('unreadCounter').textContent = `${unreadCount} unread notification${unreadCount === 1 ? '' : 's'}`;

      const filtered = allNotifs.filter(n => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'unread') return !n.read;
        if (currentFilter === 'jobs') return n.type === 'application_status' || n.type === 'jobs';
        if (currentFilter === 'sarthi') return n.type === 'sarthi' || n.type === 'interview_scheduled';
        return true;
      });

      if (!filtered.length) {
        container.innerHTML = `<div class="glass-panel" style="padding:40px;text-align:center;color:var(--text-dark);">No notifications in this category.</div>`;
        return;
      }

      const iconMap = { star:'⭐', calendar:'📅', 'x-circle':'❌', 'check-circle':'✅', eye:'👁️', bell:'🔔', message:'💬' };

      filtered.forEach(n => {
        const card = document.createElement('div');
        card.className = `glass-card notif-card ${!n.read ? 'unread' : ''}`;
        const icon = iconMap[n.icon] || '🔔';
        card.innerHTML = `
          <div class="notif-icon">${icon}</div>
          <div class="notif-info">
            <h3>${n.title}</h3>
            <p>${n.desc}</p>
            <div class="notif-time">${timeAgo(n.createdAt)}</div>
          </div>
          <div class="notif-actions">
            ${!n.read ? `<button class="action-check" title="Mark as Read" onclick="markAsRead('${n.id}')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>` : `<span style="color:var(--text-muted);font-size:0.8rem;">Read</span>`}
          </div>`;
        container.appendChild(card);
      });
    }

    async function markAsRead(id) {
      const email = localStorage.getItem('seeker_email');
      if (!email) return;
      await fetch(API_BASE + '/api/notifications/read', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, role: 'seeker', id })
      });
      await loadNotifications();
    }

    async function clearAllNotifications() {
      const email = localStorage.getItem('seeker_email');
      if (!email) return;
      await fetch(API_BASE + '/api/notifications/clear?email=' + encodeURIComponent(email) + '&role=seeker', { method: 'DELETE' });
      await loadNotifications();
    }
  </script>
</body>
</html>
